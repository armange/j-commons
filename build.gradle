plugins {
    id "io.freefair.lombok" version "9.8.0" apply false
    id "org.sonarqube" version "7.5.0.8588" apply false
    id 'idea'
}

version = '3.0.0-SNAPSHOT'

allprojects {
    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'java-test-fixtures'
    apply plugin: 'io.freefair.lombok'
    apply plugin: 'idea'

    group = 'br.com.armange'
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(11)
        }
    }

    apply from: "$rootDir/gradle/library.gradle"
    apply from: "$rootDir/gradle/repositories.gradle"
    apply from: "$rootDir/gradle/projects.gradle"
    apply from: "$rootDir/gradle/configurations.gradle"
    apply from: "$rootDir/gradle/idea.gradle"
    //apply from: "$rootDir/gradle/license.gradle"
    apply from: "$rootDir/gradle/sharedDependencies.gradle"
}

subprojects {
    apply plugin: 'org.sonarqube'
    apply from: "$projectDir/gradle/$name/dependencies.gradle"
    apply from: "$projectDir/gradle/jar.gradle"
    apply from: "$projectDir/gradle/publishing.gradle"
    apply from: "$projectDir/gradle/maven.central.gradle"
    apply from: "$projectDir/gradle/test.gradle"
}

apply from: "$projectDir/gradle/dependencies.gradle"
