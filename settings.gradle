plugins {
    id 'com.gradleup.nmcp.settings' version '1.6.2'
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

nmcpSettings {
    centralPortal {
        username = providers.environmentVariable('CENTRAL_PORTAL_USERNAME').orElse('').get()
        password = providers.environmentVariable('CENTRAL_PORTAL_PASSWORD').orElse('').get()
        publishingType = 'USER_MANAGED'
    }
}

rootProject.name = 'commons'
include 'commons-thread',
        'commons-reflection',
		'commons-object-api',
		'commons-object-impl',
		'commons-message',
		'commons-spi'
